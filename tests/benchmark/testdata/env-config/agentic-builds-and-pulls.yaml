---
# An agentic benchmark asking to build its image under a name it chose. Rejected at
# load: FAITH names what it builds, so a Dockerfile and an image name together have
# no meaning left. Copied to a tmp dir as benchmark.yaml, so it is not named that
# here: tests/benchmark/testdata is walked by the listing tests.
benchmark:
  metadata:
    name: env-config-builds-and-pulls
  output_processing:
    primary_metric: file_f1.mean
    score_fns:
      file_f1:
        type: jaccard
  agentic_config:
    task_loader:
      type: vulnerability_localization
    environment:
      type: docker
      config:
        agent_dockerfile: $BENCHMARKS_ROOT/vulnerability-localization/Dockerfile
        agent_image: faith-vulnerability-localization:latest
    answer_extractor:
      type: vulnerability_localization
    tools:
      - bash_exec
