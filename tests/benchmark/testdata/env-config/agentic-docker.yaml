---
# An agentic benchmark shaped like the shipped one: it builds its own image from a
# Dockerfile and lets FAITH name it, and carries one key only the benchmark knows
# (memory_limit). Copied to a tmp dir as benchmark.yaml, so it is not named that
# here: tests/benchmark/testdata is walked by the listing tests.
benchmark:
  metadata:
    name: env-config-agentic
  output_processing:
    primary_metric: file_f1.mean
    score_fns:
      file_f1:
        type: jaccard
  agentic_config:
    task_loader:
      type: vulnerability_localization
    environment:
      type: docker
      config:
        agent_dockerfile: $BENCHMARKS_ROOT/vulnerability-localization/Dockerfile
        memory_limit: 4g
    answer_extractor:
      type: vulnerability_localization
    tools:
      - bash_exec
