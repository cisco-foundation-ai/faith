---
# Minimal agentic benchmark for exercising the query subcommand's agentic guards.
benchmark:
  type: agentic
  metadata:
    name: fake-agentic
  output_processing:
    primary_metric: mean_file_f1
    score_fns:
      file_f1:
        type: jaccard
  agentic_config:
    task_loader:
      type: fake
    # A registered environment: parsing this config validates the name.
    environment:
      type: docker
    answer_extractor:
      type: fake
