---
name: "unit test python"

on:
  push:
  workflow_dispatch:

# Declare default permissions as read-only
permissions: read-all

# This allows a subsequently queued workflow run to interrupt previous runs
concurrency:
  group: ${{ github.workflow }} @ ${{ github.event.pull_request.head.label || github.head_ref || github.ref }} @ ${{ ((github.ref_name == 'main') && github.run_id) || ''}}
  cancel-in-progress: ${{ !( github.ref_name == 'main') }}

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: "🔒 harden runner"
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit
      - name: "📦 checkout repository"
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: "🐍 setup python via uv"
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: "3.11"
          enable-cache: true
      - name: "📥 install packages"
        run: |
          uv venv
          uv pip install -e '.[test]'
      - name: "🧪 run all unit tests"
        run: |
          source .venv/bin/activate
          make test_all

  read-only-workspace:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: "🔒 harden runner"
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit
      - name: "📦 checkout repository"
        uses: actions/checkout@e8d4307400f9427dba7cb98e488d6ab85f1cec5f
        with:
          persist-credentials: false
      - name: "🐍 setup python via uv"
        uses: astral-sh/setup-uv@d31148d669074a8d0a63714ba94f3201e7020bc3 # v8.3.0
        with:
          python-version: "3.11"
          enable-cache: true
      - name: "📥 install integration dependencies"
        run: |
          uv venv
          uv pip install -e '.[docker,kubernetes]' pytest==9.0.2
      - name: "🧱 build test images"
        run: |
          docker build --target agent -t faith-read-only-agent:test src/faith/__benchmarks__/vulnerability-localization
          docker build --target runtime -t faith-read-only-runtime:test src/faith/__benchmarks__/vulnerability-localization
      - name: "🧪 verify filesystem protection and container cleanup"
        env:
          FAITH_TEST_READ_ONLY: "1"
        run: >-
          .venv/bin/python -m pytest
          tests/agentic/environments/test_read_only_integration.py
          tests/agentic/environments/test_docker_lifecycle.py -q
